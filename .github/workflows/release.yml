name: Build, test and release

# Every push and pull request: build the Windows exe + installer and the macOS
# app, run the tests, and start both apps on real Windows and macOS machines
# to check they open (screenshots are kept as run artifacts).
# Pushes to main (and manual runs) then publish GitHub Release v<AppVersion>
# with the downloads. If that release already exists its files are replaced
# and it is marked as the latest full release, which is what the Bytehawk
# Studio Launcher installs and updates from.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path internal/core/config.go -Pattern 'AppVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Unit tests
        shell: pwsh
        run: |
          go vet ./internal/...
          go test ./internal/... -count=1

      - name: Build ShoreDrop.exe + ShoreDrop-Setup.exe
        shell: pwsh
        run: ./build.ps1

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build/ShoreDrop.exe -DestinationPath "build/ShoreDrop-${{ steps.ver.outputs.version }}-win-x64.zip" -Force

      - name: Smoke test (starts in light and dark, installer, uninstaller)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $data = Join-Path $env:APPDATA 'ShoreDrop'
          New-Item -ItemType Directory -Force $data | Out-Null
          $summary = "## Windows smoke test`n"
          foreach ($theme in 'dark', 'light') {
            @{ theme = $theme } | ConvertTo-Json | Set-Content (Join-Path $data 'settings.json')
            $p = Start-Process build/ShoreDrop.exe -PassThru
            Start-Sleep -Seconds 10
            if ($p.HasExited) { throw "ShoreDrop exited during startup with theme $theme (exit $($p.ExitCode))" }
            try {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("screenshots/windows-$theme.png")
            } catch { Write-Host "Screenshot not available: $_" }
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 1
            $summary += "- Theme **$theme**: started and ran 10 s`n"
          }
          if (Test-Path (Join-Path $data 'crash.log')) { Get-Content (Join-Path $data 'crash.log'); throw 'crash.log was written' }

          $p = Start-Process build/ShoreDrop-Setup.exe -ArgumentList '/S' -Wait -PassThru
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ShoreDrop'
          if (-not (Test-Path (Join-Path $dir 'ShoreDrop.exe'))) { throw "Installer did not install ShoreDrop.exe (exit $($p.ExitCode))" }
          $summary += "- Silent install to $dir`n"
          $p = Start-Process (Join-Path $dir 'Uninstall ShoreDrop.exe') -ArgumentList '/uninstall', '/S' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $dir 'ShoreDrop.exe')) { throw "Uninstaller left ShoreDrop.exe behind (exit $($p.ExitCode))" }
          $summary += "- Silent uninstall`n"
          $summary >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/ShoreDrop.exe
            build/ShoreDrop-Setup.exe
            build/ShoreDrop-*-win-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build ShoreDrop.app
        run: ./build-mac.sh

      - name: Smoke test (starts in light and dark)
        run: |
          set -e
          mkdir -p screenshots
          data="$HOME/Library/Application Support/ShoreDrop"
          mkdir -p "$data"
          echo "## macOS smoke test" >> "$GITHUB_STEP_SUMMARY"
          for theme in dark light; do
            printf '{"theme":"%s"}' "$theme" > "$data/settings.json"
            build/mac/ShoreDrop.app/Contents/MacOS/ShoreDrop > "screenshots/mac-$theme.log" 2>&1 &
            pid=$!
            sleep 12
            if ! kill -0 $pid 2>/dev/null; then
              cat "screenshots/mac-$theme.log"
              echo "ShoreDrop exited during startup with theme $theme"
              exit 1
            fi
            screencapture -x "screenshots/mac-$theme.png" || echo "screenshot not available"
            kill $pid || true
            sleep 2
            echo "- Theme **$theme**: started and ran 12 s" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f "$data/crash.log" ]; then cat "$data/crash.log"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/ShoreDrop-*-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: ignore

  release:
    # The Windows build gates the release; the macOS zip is added when the
    # macOS job ran (macOS runners aren't available to every private repo).
    needs: [windows, macos]
    if: always() && needs.windows.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{windows,macos}'
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.windows.outputs.version }}
        run: |
          set -e
          files="dist/ShoreDrop-Setup.exe dist/ShoreDrop.exe dist/ShoreDrop-$V-win-x64.zip"
          mac="dist/ShoreDrop-$V-macOS-arm64.zip"
          if [ -f "$mac" ]; then files="$files $mac"; fi
          ls -l $files
          notes="ShoreDrop $V — FTP, FTPS and SFTP client.

          **Windows 10/11 (x64)**
          - **ShoreDrop-Setup.exe**: installer (Start menu + desktop shortcuts, uninstaller; no admin rights needed).
          - **ShoreDrop.exe**: portable app, runs from anywhere.
          - **ShoreDrop-$V-win-x64.zip**: the portable app zipped (used by the Bytehawk Studio Launcher)."
          if [ -f "$mac" ]; then
            notes="$notes

          **macOS 11+ (Apple Silicon)**
          - **ShoreDrop-$V-macOS-arm64.zip**: unzip and drag ShoreDrop.app to Applications. The app is not notarized: allow it once in System Settings › Privacy & Security › Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/ShoreDrop.app\`."
          fi
          notes="$notes

          Built from ${GITHUB_SHA::7}."
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" $files --clobber
            gh release edit "v$V" --prerelease=false --latest --title "ShoreDrop $V" --notes "$notes"
          else
            gh release create "v$V" $files --target "$GITHUB_SHA" --latest --title "ShoreDrop $V" --notes "$notes"
          fi
